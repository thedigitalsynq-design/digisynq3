<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D281E" />
      <stop offset="100%" stop-color="#06130E" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52E3A4" />
      <stop offset="50%" stop-color="#23B272" />
      <stop offset="100%" stop-color="#16543D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#23B272" stroke-opacity="0.35" stroke-width="2" />
  
  <!-- Subtle Grid lines -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#23B272" stroke-opacity="0.1" stroke-width="1" />
  <line x1="32" y1="2" x2="32" y2="62" stroke="#23B272" stroke-opacity="0.1" stroke-width="1" />

  <!-- DigiSynq 'D' Synchronization Mark -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <rect x="18" y="16" width="6" height="32" rx="3" fill="url(#cyan-grad)" />
    
    <!-- Outer Curved Arc (D shape) -->
    <path d="M 22 16 H 34 C 44 16 50 23 50 32 C 50 41 44 48 34 48 H 22" 
          stroke="url(#cyan-grad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- Synchronized Node Core -->
    <circle cx="34" cy="32" r="3.5" fill="#FFFFFF" />
    <circle cx="34" cy="32" r="6" stroke="#D4F838" stroke-width="1.5" stroke-opacity="0.9" />
  </g>
</svg>
