<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Single Page Apps redirect handler for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    
    <!-- Primary SEO -->
    <title>DigiSynq — Asset-Light Entertainment Coordination & Industry Network</title>
    <meta name="description" content="DigiSynq is an asset-light coordination network connecting entertainment demand with distributed industry capacity across talent, partner soundstages, post-production, and audience distribution." />
